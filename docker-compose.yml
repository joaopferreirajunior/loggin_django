version: "3.9"

services:
  db:
    image: postgres:15
    container_name: loggin_postgres
    restart: always
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_DB: loggin_db
    volumes:
      - loggindata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  django:
    build: .
    container_name: loggin_django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: "no"

volumes:
  loggindata:
