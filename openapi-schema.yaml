  /patients/api/mobile/v0/:
    get:
      operationId: patients_api_mobile_v0_list
      description: Retorna lista paginada de pacientes para aplicação mobile
      summary: Listar pacientes
      tags:
      - Mobile - Patients
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MobilePatient'
          description: ''
  /patients/api/mobile/v0/{patient_id}/:
    get:
      operationId: patients_api_mobile_v0_retrieve
      description: Retorna dados de um paciente específico
      summary: Obter paciente
      parameters:
      - in: path
        name: patient_id
