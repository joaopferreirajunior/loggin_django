components:
  schemas:
    AssignUserRoleRequestRequest:
      type: object
      properties:
        user_id:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - user_id
    AssignUserRoleResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          type: string
        role:
          type: string
      required:
      - detail
      - role
      - user
    Detail:
      type: object
      description: 'Usado para mensagens simples: {"detail": "..."}'
      properties:
        detail:
          type: string
      required:
      - detail
    LoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Pode ser username ou email
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
      - user
    MobileAssignUserRoleRequestRequest:
      type: object
      properties:
        user_id:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - user_id
    MobileAssignUserRoleResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          type: string
        role:
          type: string
      required:
      - detail
      - role
      - user
    MobileDetail:
      type: object
      description: 'Usado para mensagens simples: {"detail": "..."}'
      properties:
        detail:
          type: string
      required:
      - detail
    MobileLoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Pode ser username ou email
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    MobileLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/MobileUser'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
      - user
    MobileProfile:
      type: object
      properties:
        cpf:
          type: string
          nullable: true
          maxLength: 14
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        email_confirmed:
          type: boolean
          readOnly: true
        email_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmation_token:
          type: string
          readOnly: true
          nullable: true
        confirmation_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recovery_token:
          type: string
          readOnly: true
          nullable: true
        recovery_token_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        clickhouse_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: UUID do usuário no ClickHouse
      required:
      - clickhouse_id
      - confirmation_sent_at
      - confirmation_token
      - email_confirmed
      - email_confirmed_at
      - invited_at
      - recovery_token
      - recovery_token_sent_at
    MobileRecoveryPasswordRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    MobileRecoveryPasswordResponse:
      type: object
      properties:
        detail:
          type: string
        test_link:
          type: string
        test_token:
          type: string
      required:
      - detail
      - test_link
      - test_token
    MobileRegisterResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/MobileUser'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - detail
      - refresh
      - user
    MobileResetPasswordRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - token
    MobileResetPasswordSuccess:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    MobileUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        profile:
          allOf:
          - $ref: '#/components/schemas/MobileProfile'
          readOnly: true
      required:
      - id
      - profile
      - username
    MobileUserPermissions:
      type: object
      properties:
        user_role:
          type: string
        is_system_admin:
          type: boolean
        is_office_admin:
          type: boolean
        is_regular_user:
          type: boolean
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        can_manage_users:
          type: boolean
        can_view_all_users:
          type: boolean
        can_access_admin:
          type: boolean
      required:
      - can_access_admin
      - can_manage_users
      - can_view_all_users
      - groups
      - is_office_admin
      - is_regular_user
      - is_system_admin
      - permissions
      - user_role
    MobileUserRegisterRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
        cpf:
          type: string
          nullable: true
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
      required:
      - email
      - password
      - username
    PatchedMobileProfileRequest:
      type: object
      properties:
        cpf:
          type: string
          nullable: true
          maxLength: 14
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
    PatchedProfileRequest:
      type: object
      properties:
        cpf:
          type: string
          nullable: true
          maxLength: 14
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
    Profile:
      type: object
      properties:
        cpf:
          type: string
          nullable: true
          maxLength: 14
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        email_confirmed:
          type: boolean
          readOnly: true
        email_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmation_token:
          type: string
          readOnly: true
          nullable: true
        confirmation_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recovery_token:
          type: string
          readOnly: true
          nullable: true
        recovery_token_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        clickhouse_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: UUID do usuário no ClickHouse
      required:
      - clickhouse_id
      - confirmation_sent_at
      - confirmation_token
      - email_confirmed
      - email_confirmed_at
      - invited_at
      - recovery_token
      - recovery_token_sent_at
    RecoveryPasswordRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    RecoveryPasswordResponse:
      type: object
      properties:
        detail:
          type: string
        test_link:
          type: string
        test_token:
          type: string
      required:
      - detail
      - test_link
      - test_token
    RegisterResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/User'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - detail
      - refresh
      - user
    ResetPasswordRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - token
    ResetPasswordSuccess:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    RoleEnum:
      enum:
      - system_admin
      - office_admin
      - regular_user
      type: string
      description: |-
        * `system_admin` - system_admin
        * `office_admin` - office_admin
        * `regular_user` - regular_user
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
      - id
      - profile
      - username
    UserPermissions:
      type: object
      properties:
        user_role:
          type: string
        is_system_admin:
          type: boolean
        is_office_admin:
          type: boolean
        is_regular_user:
          type: boolean
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        can_manage_users:
          type: boolean
        can_view_all_users:
          type: boolean
        can_access_admin:
          type: boolean
      required:
      - can_access_admin
      - can_manage_users
      - can_view_all_users
      - groups
      - is_office_admin
      - is_regular_user
      - is_system_admin
      - permissions
      - user_role
    UserRegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
        cpf:
          type: string
          nullable: true
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
      required:
      - email
      - password
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
