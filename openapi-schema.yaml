  /users/api/mobile/v0/add-patient/:
    post:
      operationId: users_api_mobile_v0_add_patient_create
      description: Adiciona um paciente à lista de pacientes atendidos pelo usuário
      summary: Adicionar paciente aos meus cuidados
      tags:
      - Mobile - User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                patient:
                  type: string
                  format: uuid
                  description: ID do paciente
                notes:
                  type: string
                  required: false
                  description: Notas sobre o relacionamento
              required:
              - patient
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  relation:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      patientName:
                        type: string
                      startDate:
                        type: string
                        format: date-time
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
