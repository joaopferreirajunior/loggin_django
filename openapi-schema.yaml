openapi: 3.0.3
info:
  title: Medical San Loggin API
  version: 1.0.0
  description: API Web e Mobile do sistema Medical San Loggin
  contact:
    name: Medical San Support
    email: support@medicalsan.com
  license:
    name: Private License
paths:
  /users/api/mobile/v0/assign-role/:
    post:
      operationId: users_api_mobile_v0_assign_role_create
      description: Atribui um papel a um usuário (apenas system_admin pode fazer isso)
      tags:
      - Mobile - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAssignUserRoleRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAssignUserRoleResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
  /users/api/mobile/v0/login/:
    post:
      operationId: users_api_mobile_v0_login_create
      tags:
      - Mobile - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileLoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Credenciais inválidas ou email não encontrado
  /users/api/mobile/v0/logout/:
    post:
      operationId: users_api_mobile_v0_logout_create
      tags:
      - Mobile - Auth
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
  /users/api/mobile/v0/me/:
    get:
      operationId: users_api_mobile_v0_me_retrieve
      description: Retorna os dados do próprio usuário logado.
      tags:
      - Mobile - User
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUser'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
  /users/api/mobile/v0/me/permissions/:
    get:
      operationId: users_api_mobile_v0_me_permissions_retrieve
      description: Retorna as permissões e grupo do usuário atual
      tags:
      - Mobile - User
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUserPermissions'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
  /users/api/mobile/v0/me/profile/:
    get:
      operationId: users_api_mobile_v0_me_profile_retrieve
      description: Retorna os dados do perfil do próprio usuário logado.
      tags:
      - Mobile - User
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileProfile'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
    patch:
      operationId: users_api_mobile_v0_me_profile_partial_update
      description: |-
        Atualiza parcialmente os campos do perfil do próprio usuário (cpf, birth, phone).
        Exemplo JSON:
        { "cpf": "123.456.789-10", "phone": "+55 16 99999-0000" }
      tags:
      - Mobile - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMobileProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileProfile'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: ''
  /users/api/mobile/v0/recoverypassword/:
    post:
      operationId: users_api_mobile_v0_recoverypassword_create
      description: |-
        Endpoint para solicitar recuperação de senha via email.
        Recebe email do usuário e envia token de recuperação.
      tags:
      - Mobile - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileRecoveryPasswordRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRecoveryPasswordResponse'
          description: Mensagem genérica de sucesso. Em ambiente de desenvolvimento
            pode retornar test_link e test_token.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Email é obrigatório
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Erro interno do servidor
  /users/api/mobile/v0/register/:
    post:
      operationId: users_api_mobile_v0_register_create
      tags:
      - Mobile - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileUserRegisterRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Erros de validação do cadastro
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Erro interno do servidor
  /users/api/mobile/v0/resetpassword/:
    post:
      operationId: users_api_mobile_v0_resetpassword_create
      description: |-
        Endpoint para resetar senha usando token de recuperação.
        Recebe token e nova senha, valida e atualiza a senha do usuário.
      tags:
      - Mobile - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileResetPasswordRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileResetPasswordSuccess'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Token inválido/expirado ou problemas como senha curta, token
            ausente, etc.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDetail'
          description: Erro interno do servidor
  /users/api/mobile/v0/token/refresh/:
    post:
      operationId: users_api_mobile_v0_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /users/api/web/v0/assign-role/:
    post:
      operationId: assign_role
      description: Permite alterar o grupo/role de um usuário (apenas para administradores).
      summary: Atribuir role ao usuário
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /users/api/web/v0/login/:
    post:
      operationId: users_api_web_v0_login_create
      tags:
      - Web - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /users/api/web/v0/logout/:
    post:
      operationId: users_api_web_v0_logout_create
      description: Logout do usuário na web
      tags:
      - Web - Auth
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /users/api/web/v0/me/:
    get:
      operationId: get_current_user
      description: Retorna dados básicos do usuário autenticado.
      summary: Obter dados do usuário atual
      tags:
      - User Management
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /users/api/web/v0/me/permissions/:
    get:
      operationId: get_user_permissions
      description: Retorna permissões e grupos do usuário autenticado.
      summary: Obter permissões do usuário
      tags:
      - User Management
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissions'
          description: ''
  /users/api/web/v0/me/profile/:
    get:
      operationId: get_user_profile
      description: Retorna dados completos do perfil do usuário autenticado.
      summary: Obter perfil completo do usuário
      tags:
      - User Management
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: update_user_profile
      description: Atualiza dados do perfil do usuário autenticado.
      summary: Atualizar perfil do usuário
      tags:
      - User Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /users/api/web/v0/profile/image/:
    post:
      operationId: upload_profile_image
      description: Faz upload de uma nova imagem de perfil. A imagem será redimensionada
        automaticamente para 800x800px mantendo proporção.
      summary: Upload de imagem de perfil
      tags:
      - User Management
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profile_image:
                  type: string
                  format: binary
                  description: Arquivo de imagem (JPEG, PNG, WebP - máximo 5MB)
              required:
              - profile_image
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadProfileImageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Erro de validação da imagem
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Token de autenticação necessário
          description: ''
    delete:
      operationId: delete_profile_image
      description: Remove a imagem de perfil atual do usuário.
      summary: Remover imagem de perfil
      tags:
      - User Management
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProfileImageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Usuário não possui imagem de perfil
          description: ''
  /users/api/web/v0/profile/image/{user_id}/:
    get:
      operationId: serve_profile_image
      description: Serve a imagem de perfil como proxy do S3 (alternativa a presigned
        URLs)
      summary: Servir imagem de perfil
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        description: ID do usuário
        required: true
      tags:
      - User Management
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Imagem servida com sucesso
                content:
                  image/jpeg: {}
                  image/png: {}
                  image/webp: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Imagem não encontrada
          description: ''
  /users/api/web/v0/recoverypassword/:
    post:
      operationId: users_api_web_v0_recoverypassword_create
      description: Recuperação de senha por email
      tags:
      - Web - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryResponse'
          description: ''
  /users/api/web/v0/register/:
    post:
      operationId: users_api_web_v0_register_create
      description: Cadastro de novos usuários na web
      tags:
      - Web - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /users/api/web/v0/resetpassword/:
    post:
      operationId: users_api_web_v0_resetpassword_create
      description: Reset de senha usando token
      tags:
      - Web - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /users/api/web/v0/token/refresh/:
    post:
      operationId: users_api_web_v0_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /users/api/web/v0/validatetoken/:
    get:
      operationId: users_api_web_v0_validatetoken_retrieve
      description: Valida token de recuperação
      tags:
      - Web - Auth
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidation'
          description: ''
components:
  schemas:
    AuthResponse:
      type: object
      description: Serializer para respostas de autenticação
      properties:
        detail:
          type: string
      required:
      - detail
    DeleteProfileImageResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/UserWithImage'
      required:
      - detail
      - user
    LoginRequest:
      type: object
      description: Serializer para login
      properties:
        username:
          type: string
          minLength: 1
          description: Username ou email do usuário
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Senha do usuário
      required:
      - password
      - username
    LoginResponse:
      type: object
      description: Serializer para resposta de login
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/User'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - detail
      - refresh
      - user
    MobileAssignUserRoleRequestRequest:
      type: object
      properties:
        user_id:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - user_id
    MobileAssignUserRoleResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          type: string
        role:
          type: string
      required:
      - detail
      - role
      - user
    MobileDetail:
      type: object
      description: 'Usado para mensagens simples: {"detail": "..."}'
      properties:
        detail:
          type: string
      required:
      - detail
    MobileLoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Pode ser username ou email
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    MobileLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/MobileUser'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
      - user
    MobileProfile:
      type: object
      properties:
        cpf:
          type: string
          nullable: true
          maxLength: 14
        birth:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        email_confirmed:
          type: boolean
          readOnly: true
        email_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmation_token:
          type: string
          readOnly: true
          nullable: true
        confirmation_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recovery_token:
          type: string
          readOnly: true
          nullable: true
        recovery_token_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        clickhouse_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: UUID do usuário no ClickHouse
        profile_image_url:
          type: string
          description: Retorna URL completa da imagem de perfil do S3
          readOnly: true
      required:
      - clickhouse_id
      - confirmation_sent_at
      - confirmation_token
      - email_confirmed
      - email_confirmed_at
      - invited_at
      - profile_image_url
      - recovery_token
      - recovery_token_sent_at
    MobileRecoveryPasswordRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    MobileRecoveryPasswordResponse:
      type: object
      properties:
        detail:
          type: string
        test_link:
          type: string
        test_token:
          type: string
      required:
      - detail
      - test_link
      - test_token
    MobileRegisterResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/MobileUser'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - detail
      - refresh
      - user
    MobileResetPasswordRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - token
    MobileResetPasswordSuccess:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    MobileUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        profile:
          allOf:
          - $ref: '#/components/schemas/MobileProfile'
          readOnly: true
      required:
      - id
      - profile
      - username
    MobileUserPermissions:
      type: object
      properties:
        user_role:
          type: string
        is_system_admin:
          type: boolean
        is_office_admin:
          type: boolean
        is_regular_user:
          type: boolean
        groups:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        can_manage_users:
          type: boolean
        can_view_all_users:
          type: boolean
        can_access_admin:
          type: boolean
      required:
      - can_access_admin
      - can_manage_users
      - can_view_all_users
      - groups
      - is_office_admin
      - is_regular_user
      - is_system_admin
      - permissions
      - user_role
    MobileUserRegisterRequestRequest:
      type: object
      properties:
        username:
          type: string
