components:
  schemas:
    AuthResponse:
      type: object
      description: Serializer para respostas de autenticação
      properties:
        detail:
          type: string
      required:
      - detail
    DeleteProfileImageResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/UserWithImage'
      required:
      - detail
      - user
    GenderEnum:
      enum:
      - MALE
      - FEMALE
      - OTHER
      - UNKNOWN
      type: string
      description: |-
        * `MALE` - Male
        * `FEMALE` - Female
        * `OTHER` - Other
        * `UNKNOWN` - Unknown
    LoginRequest:
      type: object
      description: Serializer para login
      properties:
        username:
          type: string
          minLength: 1
          description: Username ou email do usuário
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Senha do usuário
      required:
      - password
      - username
    LoginResponse:
      type: object
      description: Serializer para resposta de login
      properties:
        detail:
          type: string
        user:
          $ref: '#/components/schemas/User'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - detail
      - refresh
      - user
    MobileAssignUserRoleRequestRequest:
      type: object
      properties:
        user_id:
          type: integer
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - user_id
    MobileAssignUserRoleResponse:
      type: object
      properties:
        detail:
          type: string
        user:
          type: string
        role:
          type: string
      required:
      - detail
      - role
      - user
    MobileDetail:
      type: object
      description: 'Usado para mensagens simples: {"detail": "..."}'
      properties:
        detail:
          type: string
      required:
      - detail
    MobileDetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    MobileLoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Pode ser username ou email
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    MobileLoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/MobileUser'
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - refresh
      - user
    MobileMedicalRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patientId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        doctorName:
          type: string
        complaint:
          type: string
        clinicalNotes:
          type: string
        anamnese:
          nullable: true
      required:
      - clinicalNotes
      - complaint
      - createdAt
      - doctorName
      - id
      - patientId
    MobileMedicalRecordRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        doctorName:
          type: string
          minLength: 1
