openapi: 3.0.3
info:
  title: Medical San Loggin API
  version: 1.0.0
  description: API Web e Mobile do sistema Medical San Loggin
paths:
  /api/v0/assign-role/:
    post:
      operationId: api_v0_assign_role_create
      description: Atribui um papel a um usuário (apenas system_admin pode fazer isso)
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRoleRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignUserRoleResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v0/login/:
    post:
      operationId: api_v0_login_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Credenciais inválidas ou email não encontrado
  /api/v0/logout/:
    post:
      operationId: api_v0_logout_create
      tags:
      - Auth
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v0/me/:
    get:
      operationId: api_v0_me_retrieve
      description: Retorna os dados do próprio usuário logado.
      tags:
      - User
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v0/me/permissions/:
    get:
      operationId: api_v0_me_permissions_retrieve
      description: Retorna as permissões e grupo do usuário atual
      tags:
      - User
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissions'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v0/me/profile/:
    get:
      operationId: api_v0_me_profile_retrieve
      description: Retorna os dados do perfil do próprio usuário logado.
      tags:
      - User
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: api_v0_me_profile_partial_update
      description: |-
        Atualiza parcialmente os campos do perfil do próprio usuário (cpf, birth, phone).
        Exemplo JSON:
        { "cpf": "123.456.789-10", "phone": "+55 16 99999-0000" }
      tags:
      - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v0/recoverypassword/:
    post:
      operationId: api_v0_recoverypassword_create
      description: |-
        Endpoint para solicitar recuperação de senha via email.
        Recebe email do usuário e envia token de recuperação.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryPasswordRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPasswordResponse'
          description: Mensagem genérica de sucesso. Em ambiente de desenvolvimento
            pode retornar test_link e test_token.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Email é obrigatório
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Erro interno do servidor
  /api/v0/register/:
    post:
      operationId: api_v0_register_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Erros de validação do cadastro
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Erro interno do servidor
  /api/v0/resetpassword/:
    post:
      operationId: api_v0_resetpassword_create
      description: |-
        Endpoint para resetar senha usando token de recuperação.
        Recebe token e nova senha, valida e atualiza a senha do usuário.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordSuccess'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Token inválido/expirado ou problemas como senha curta, token
            ausente, etc.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Erro interno do servidor
  /api/v0/token/refresh/:
    post:
      operationId: api_v0_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
