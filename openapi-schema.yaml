      summary: Listar meus pacientes
      tags:
      - Mobile - User
      security:
      - cookieAuth: []
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    relationId:
                      type: string
                      format: uuid
                    patientId:
                      type: string
                      format: uuid
                    patientName:
                      type: string
                    patientCpf:
                      type: string
                    patientPhone:
                      type: string
                    startDate:
                      type: string
                      format: date-time
                    isActive:
                      type: boolean
          description: ''
