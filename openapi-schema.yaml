openapi: 3.0.3
info:
  title: Medical San Loggin API
  version: 1.0.0
  description: API Web e Mobile do sistema Loggin com endpoints organizados por plataforma
  contact:
    name: Medical San Support
    email: support@medicalsan.com
  license:
    name: Private License
